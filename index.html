<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Edel Grocery List</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#16a34a;--accent-soft:#dcfce7}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--card:#151b23;--text:#f3f4f6;--muted:#9ca3af;--line:#232b36;--accent:#22c55e;--accent-soft:#12321f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ca3af;margin-right:6px}
.dot.on{background:var(--accent)}
form{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
input{flex:1;border:0;background:transparent;color:var(--text);font:inherit;font-size:16px;padding:10px 12px;outline:none;min-width:0}
button{font:inherit;cursor:pointer}
.add{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:600}
.list{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;color:#fff;font-size:13px}
.item.done .check{background:var(--accent);border-color:var(--accent)}
.name{flex:1;font-size:16px;word-break:break-word}
.item.done .name{color:var(--muted);text-decoration:line-through}
.by{font-size:12px;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);font-size:20px;padding:0 4px;opacity:.6}
.del:hover{opacity:1;color:#ef4444}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px;color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.who{font-size:13px;color:var(--muted);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>🛒 Edel Groceries</h1><div class="sub"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div></div>
    <button class="who" id="who"></button>
  </header>
  <form id="f"><input id="q" placeholder="Add an item… (e.g. milk)" autocomplete="off" enterkeyhint="done"><button class="add">Add</button></form>
  <div class="list" id="list"></div>
  <div class="bar"><span id="count"></span><button class="link" id="clear">Clear checked</button></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { firebaseConfig } from "./config.js";

const db = getDatabase(initializeApp(firebaseConfig));
const itemsRef = ref(db, "items");
const $ = id => document.getElementById(id);
let items = {};

let me = localStorage.getItem("name");
const setWho = () => $("who").textContent = me ? "👤 " + me : "Set your name";
$("who").onclick = () => { const n = prompt("Your name?", me || ""); if (n !== null) { me = n.trim(); localStorage.setItem("name", me); setWho(); } };
setWho();

onValue(ref(db, ".info/connected"), s => { $("dot").classList.toggle("on", !!s.val()); $("status").textContent = s.val() ? "Live · synced for everyone" : "Offline"; });
onValue(itemsRef, s => { items = s.val() || {}; render(); });

$("f").onsubmit = e => {
  e.preventDefault();
  const name = $("q").value.trim().slice(0, 100);
  if (!name) return;
  push(itemsRef, { name, done: false, by: me || "", at: Date.now() });
  $("q").value = "";
};
$("clear").onclick = () => Object.entries(items).forEach(([k, v]) => v.done && remove(ref(db, "items/" + k)));

function render() {
  const list = Object.entries(items).sort((a, b) => (a[1].done - b[1].done) || (b[1].at - a[1].at));
  $("list").innerHTML = "";
  if (!list.length) $("list").innerHTML = '<div class="empty">Nothing on the list yet 🎉</div>';
  for (const [k, v] of list) {
    const row = document.createElement("div");
    row.className = "item" + (v.done ? " done" : "");
    row.innerHTML = `<button class="check">${v.done ? "✓" : ""}</button><div class="name"></div><button class="del" title="Remove">×</button>`;
    row.querySelector(".name").textContent = v.name;
    if (v.by) { const b = document.createElement("div"); b.className = "by"; b.textContent = v.by; row.querySelector(".name").append(b); }
    row.querySelector(".check").onclick = () => update(ref(db, "items/" + k), { done: !v.done });
    row.querySelector(".del").onclick = () => remove(ref(db, "items/" + k));
    $("list").append(row);
  }
  const left = list.filter(([, v]) => !v.done).length;
  $("count").textContent = `${left} item${left === 1 ? "" : "s"} left`;
}
</script>
</body>
</html>
