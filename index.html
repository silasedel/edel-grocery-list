<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9f5df">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Edel Grocery List</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#e9fbe9;--bg2:#cdeed6;--card:rgba(255,255,255,.82);--text:#1f3d2b;--muted:#6f8f7a;--line:#d6ecd9;--accent:#4cc47a;--accent2:#ffb84d;--pink:#ff8fab}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);font-family:Fredoka,system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.f{position:absolute;will-change:transform;filter:drop-shadow(0 8px 10px rgba(30,80,50,.18));animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{margin-top:-14px}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:24px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:8px}
h1{font-size:30px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c7c7c7;margin-right:6px}
.dot.on{background:var(--accent);box-shadow:0 0 0 3px #bdf0cf}
button{font:inherit;cursor:pointer;color:inherit}
.pill{border:0;background:var(--card);backdrop-filter:blur(8px);border-radius:999px;padding:8px 14px;font-weight:500;box-shadow:0 4px 14px rgba(40,110,70,.12)}
.top{display:flex;gap:8px;flex:none}
@media (max-width:480px){header{flex-wrap:wrap}h1{font-size:26px}.top{width:100%}.top .pill{flex:1;padding:10px}.wrap{padding-top:calc(16px + env(safe-area-inset-top))}.item{padding:16px 14px}.del{font-size:26px;padding:0 8px}}
form{display:flex;gap:8px;background:var(--card);backdrop-filter:blur(10px);border-radius:20px;padding:7px;box-shadow:0 8px 24px rgba(40,110,70,.14)}
input{flex:1;border:0;background:transparent;color:var(--text);font:inherit;font-size:17px;padding:10px 12px;outline:none;min-width:0}
.add{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:0 20px;font-weight:600;font-size:16px;transition:transform .15s}
.add:active{transform:scale(.92)}
.list{margin-top:16px;background:var(--card);backdrop-filter:blur(10px);border-radius:20px;position:relative;box-shadow:0 8px 24px rgba(40,110,70,.12)}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.item.new{animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.item:first-child{border-top:0}
.emo{font-size:24px;width:30px;text-align:center}
.check{width:26px;height:26px;border-radius:50%;border:2.5px solid #bfe3c8;background:#fff;flex:none;display:grid;place-items:center;color:#fff;font-size:14px;transition:transform .15s}
.check:active{transform:scale(.8)}
.item.done .check{background:var(--accent);border-color:var(--accent)}
.name{flex:1;font-size:17px;word-break:break-word}
.item.done .name{color:var(--muted);text-decoration:line-through}
.by{font-size:12px;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);font-size:22px;padding:0 4px;opacity:.5}
.del:hover{opacity:1;color:var(--pink)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:17px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:15px;color:var(--muted);padding:0 4px}
.link{border:0;background:none;color:#2f9e5c;font-weight:600;padding:0}
.modal{position:fixed;inset:0;background:rgba(30,60,40,.35);display:none;align-items:center;justify-content:center;z-index:5;padding:16px}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:24px;padding:22px;width:100%;max-width:440px;max-height:80vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.2);animation:pop .25s}
.sheet h2{margin:0 0 14px;font-size:22px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.person{border:2px solid var(--line);background:#f6fdf7;border-radius:18px;padding:14px 8px;font-size:16px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:4px}
.person span{font-size:30px}
.person.sel{border-color:var(--accent);background:#e3f8e9}
.log{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.log:first-of-type{border-top:0}
.log small{color:var(--muted);display:block}
.close{float:right;border:0;background:none;font-size:24px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>🛒 Edel Groceries</h1><div class="sub"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div></div>
    <div class="top"><button class="pill" id="logBtn">📜 Got it log</button><button class="pill" id="who"></button></div>
  </header>
  <form id="f"><input id="q" placeholder="What do we need?" autocomplete="off" enterkeyhint="done"><button class="add">Add</button></form>
  <div class="list" id="list"></div>
  <div class="bar"><span id="count"></span></div>
</div>

<div class="modal" id="whoM"><div class="sheet"><button class="close" data-close>×</button><h2>Who's this?</h2><div class="people" id="people"></div></div></div>
<div class="modal" id="logM"><div class="sheet"><button class="close" data-close>×</button><h2>📜 Activity log</h2><div id="logList"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient("https://qhjqaijkthmmpllgpspl.supabase.co", "sb_publishable_wO3zgPkdNH2Effsy6ewrmg_XP5oLUqO", { auth: { persistSession: false } });
const $ = id => document.getElementById(id);
const AVATARS = ["🦊","🐻","🐼","🐸","🐨","🦁","🐯","🐵","🐰","🐧"];
let data = { items: [], log: [], people: ["Mom", "Dad", "Silas"] };

// Pick emoji for an item name
const MAP = {milk:"🥛",egg:"🥚",bread:"🍞",apple:"🍎",banana:"🍌",carrot:"🥕",cheese:"🧀",avocado:"🥑",tomato:"🍅",chicken:"🍗",meat:"🥩",beef:"🥩",fish:"🐟",rice:"🍚",pasta:"🍝",coffee:"☕",tea:"🍵",juice:"🧃",water:"💧",butter:"🧈",lettuce:"🥬",salad:"🥗",potato:"🥔",onion:"🧅",garlic:"🧄",grape:"🍇",strawberr:"🍓",orange:"🍊",lemon:"🍋",watermelon:"🍉",corn:"🌽",broccoli:"🥦",pepper:"🫑",cookie:"🍪",chocolate:"🍫",ice:"🍦",pizza:"🍕",cereal:"🥣",yogurt:"🥛",soap:"🧼",paper:"🧻",chip:"🥔",candy:"🍬",cake:"🍰",honey:"🍯",bacon:"🥓",blueberr:"🫐",peach:"🍑",pear:"🍐",cucumber:"🥒",mushroom:"🍄",bagel:"🥯",soda:"🥤",wine:"🍷",beer:"🍺"};
const emoji = n => { n = n.toLowerCase(); for (const k in MAP) if (n.includes(k)) return MAP[k]; return "🛍️"; };
const ava = name => AVATARS[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % AVATARS.length];

// Who am I — tap a face, no typing
let me = localStorage.getItem("name");
const setWho = () => $("who").textContent = me ? me : "Who are you?";
function openWho() {
  $("people").innerHTML = "";
  for (const p of data.people) {
    const b = document.createElement("button");
    b.className = "person" + (p === me ? " sel" : "");
    b.textContent = p;
    b.onclick = () => { me = p; localStorage.setItem("name", me); setWho(); $("whoM").classList.remove("open"); };
    $("people").append(b);
  }
  const add = document.createElement("button");
  add.className = "person"; add.textContent = "+ Add person";
  add.onclick = () => { const n = (prompt("Name?") || "").trim().slice(0, 20); if (n && !data.people.includes(n)) change({ t: "person", n }).then(openWho); };
  $("people").append(add);
  $("whoM").classList.add("open");
}
$("who").onclick = openWho;
$("logBtn").onclick = () => { renderLog(); $("logM").classList.add("open"); };
document.querySelectorAll(".modal").forEach(m => m.onclick = e => { if (e.target === m || e.target.hasAttribute("data-close")) m.classList.remove("open"); });
setWho();

function status(ok) { $("dot").classList.toggle("on", ok); $("status").textContent = ok ? "Live · shared with the fam" : "Offline, showing last saved list"; }
const norm = d => ({ items: d.items || [], log: d.log || [], people: d.people && d.people.length ? d.people : ["Mom", "Dad", "Silas"] });

let lastJson = "", seen = new Set(), flushing = false;
// Changes are queued on this device and retried until the server confirms them
let queue = [];
try { queue = JSON.parse(localStorage.getItem("queue") || "[]"); } catch {}
const saveQ = () => { try { localStorage.setItem("queue", JSON.stringify(queue)); } catch {} };

function apply(d, op) {
  const x = d.items.find(i => i.id === op.id);
  if (op.t === "add" && !x) d.items.push(op.item);
  if (op.t === "set" && x) Object.assign(x, op.v);
  if (op.t === "del" && x) d.items.splice(d.items.indexOf(x), 1);
  if (op.t === "clear") d.items = d.items.filter(i => !i.done);
  if (op.t === "person" && !d.people.includes(op.n)) d.people.push(op.n);
  if (op.log && !d.log.some(l => l.at === op.log.at && l.who === op.log.who)) d.log.push(op.log);
}
const withQueue = d => { queue.forEach(op => apply(d, op)); return d; };

async function get() {
  const [i, l, p] = await Promise.all([
    sb.from("edel_grocery_items").select("*"),
    sb.from("edel_grocery_log").select("who,text,at").order("at", { ascending: false }).limit(200),
    sb.from("edel_grocery_people").select("name"),
  ]);
  const err = i.error || l.error || p.error;
  if (err) throw err;
  return norm({
    items: i.data.map(r => ({ id: r.id, name: r.name, done: r.done, by: r.added_by, got: r.got, at: r.at })),
    log: l.data.reverse(),
    people: ["Mom", "Dad", "Silas"].filter(n => !p.data.some(r => r.name === n)).concat(p.data.map(r => r.name)),
  });
}
async function load() {
  try {
    const d = await get();
    data = withQueue(d); status(true); render();
    try { localStorage.setItem("cache", JSON.stringify({ ...d, edel_v2: 1 })); } catch {}
    if (queue.length) flush();
  } catch { status(false); setTimeout(load, 15000); }
}

// Send one queued change; every op is safe to resend
async function send(op) {
  const T = sb.from("edel_grocery_items");
  let r = { error: null };
  if (op.t === "add") r = await T.upsert({ id: op.item.id, name: op.item.name, done: !!op.item.done, added_by: op.item.by || "", got: "", at: op.item.at }, { onConflict: "id", ignoreDuplicates: true });
  if (op.t === "set") r = await T.update({ done: op.v.done, got: op.v.got || "" }).eq("id", op.id);
  if (op.t === "del") r = await T.delete().eq("id", op.id);
  if (op.t === "clear") r = await T.delete().eq("done", true);
  if (op.t === "person") r = await sb.from("edel_grocery_people").upsert({ name: op.n }, { onConflict: "name", ignoreDuplicates: true });
  if (r.error) throw r.error;
  if (op.log) {
    const ex = await sb.from("edel_grocery_log").select("at").eq("at", op.log.at).eq("who", op.log.who).limit(1);
    if (ex.error) throw ex.error;
    if (!ex.data.length) { const w = await sb.from("edel_grocery_log").insert(op.log); if (w.error) throw w.error; }
  }
}

async function flush() {
  if (flushing || !queue.length) return;
  flushing = true;
  try {
    while (queue.length) { await send(queue[0]); queue.shift(); saveQ(); }
    status(true);
  } catch {
    $("status").textContent = "Saving… (will keep retrying)";
    setTimeout(flush, 5000);
  } finally { flushing = false; }
}

function change(op, quiet) {
  if (op.log) op.log = { who: me || "Someone", text: op.log, at: Date.now() };
  queue.push(op); saveQ();
  apply(data, op);
  if (!quiet) render();
  return flush();
}

$("f").onsubmit = e => {
  e.preventDefault();
  const name = $("q").value.trim().slice(0, 100);
  if (!name) return;
  if (!me) return openWho();
  const item = { id: Date.now() + Math.random().toString(36).slice(2, 6), name, done: false, by: me, at: Date.now() };
  change({ t: "add", id: item.id, item, log: `added ${name}` });
  $("q").value = "";
};

const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
// Play an exit animation on a row, then redraw so the others slide up
function flyOut(row, frames, ms) {
  row.style.pointerEvents = "none"; row.style.zIndex = 2; row.style.position = "relative";
  animating++;
  const a = row.animate(frames, { duration: ms, easing: "ease-in", fill: "forwards" });
  let done = false;
  const end = () => { if (done) return; done = true; row.style.visibility = "hidden"; animating--; render(); };
  a.onfinish = end; setTimeout(end, ms + 300); // fallback if the browser drops the animation
}
// Redraws wait until exit animations finish, so a live update can't snap a row back
let animating = 0;
function render() {
  if (animating) return;
  draw();
}
function draw() {
  const json = JSON.stringify(data.items);
  if (json === lastJson) return;
  lastJson = json;
  const list = data.items.filter(v => !v.done).sort((a, b) => b.at - a.at);
  // FLIP: remember where rows were so the rest can slide into place
  const before = {};
  if (!still) $("list").querySelectorAll(".item").forEach(r => before[r.dataset.id] = r.getBoundingClientRect().top);
  $("list").innerHTML = "";
  if (!list.length) $("list").innerHTML = '<div class="empty">🧺 All stocked up!</div>';
  for (const v of list) {
    const row = document.createElement("div");
    row.className = "item" + (v.done ? " done" : "") + (seen.size && !seen.has(v.id) ? " new" : "");
    row.dataset.id = v.id;
    row.innerHTML = `<button class="check">${v.done ? "✓" : ""}</button><div class="name"></div><button class="del" title="Remove">×</button>`;
    row.querySelector(".name").textContent = v.name;
    const sub = v.done && v.got ? `✅ ${v.got} got it` : v.by ? `added by ${v.by}` : "";
    if (sub) { const b = document.createElement("div"); b.className = "by"; b.textContent = sub; row.querySelector(".name").append(b); }
    row.querySelector(".check").onclick = () => {
      if (!me) return openWho();
      const op = { t: "del", id: v.id, log: `got ${v.name}` }; // got it: off the list, kept in the log
      if (still) return change(op);
      change(op, true); // saved right away; the animation is only visual
      row.classList.add("done"); row.querySelector(".check").textContent = "✓";
      const dir = Math.random() < .5 ? -1 : 1;
      flyOut(row, [
        { transform: "none", opacity: 1 },
        { transform: "translateY(-10px) scale(1.04)", opacity: 1, offset: .18, easing: "cubic-bezier(.5,0,.9,.5)" },
        { transform: `translate(${dir * 60}px, 140px) rotate(${dir * 14}deg) scale(.9)`, opacity: 0 },
      ], 600);
    };
    row.querySelector(".del").onclick = () => {
      const op = { t: "del", id: v.id, log: `removed ${v.name}` };
      if (still) return change(op);
      change(op, true);
      row.style.background = "#ffe1e1";
      flyOut(row, [
        { transform: "none", opacity: 1 },
        { transform: "translateX(-6px) rotate(-1deg)", offset: .1 },
        { transform: "translateX(6px) rotate(1deg)", offset: .2 },
        { transform: "translateX(-4px)", offset: .3 },
        { transform: "translateX(3px)", offset: .4, opacity: 1 },
        { transform: "scale(.96)", opacity: 0 },
      ], 420);
    };
    $("list").append(row);
  }
  if (!still) $("list").querySelectorAll(".item").forEach(r => {
    const dy = before[r.dataset.id] - r.getBoundingClientRect().top;
    if (dy) r.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 260, easing: "cubic-bezier(.2,.8,.2,1)" });
  });
  list.forEach(v => seen.add(v.id)); if (!seen.size) seen.add("");
  const left = list.filter(v => !v.done).length;
  $("count").textContent = `${left} item${left === 1 ? "" : "s"} left`;
}

function ago(t) { const s = (Date.now() - t) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.floor(s/60) + "m ago" : s < 86400 ? Math.floor(s/3600) + "h ago" : new Date(t).toLocaleDateString(); }
function renderLog() {
  const el = $("logList"); el.innerHTML = "";
  if (!data.log.length) el.innerHTML = '<div class="empty">Nothing yet</div>';
  for (const l of [...data.log].reverse()) {
    const row = document.createElement("div"); row.className = "log";
    const t = document.createElement("div"); t.textContent = `${l.who} ${l.text}`;
    const s = document.createElement("small"); s.textContent = ago(l.at); t.append(s);
    row.append(t);
    el.append(row);
  }
}

// One-time move: re-send every item the old version kept on this phone (resending is harmless)
try {
  const old = localStorage.getItem("cache");
  if (old && !old.includes("edel_v2") && !localStorage.getItem("migrated")) {
    for (const it of norm(JSON.parse(old)).items) if (it && it.id && it.name) queue.push({ t: "add", id: it.id, item: it });
    saveQ(); localStorage.setItem("migrated", "1");
  }
} catch {}
// Show the last list plus any unsent changes right away, even before the server answers
try { const c = localStorage.getItem("cache"); data = withQueue(norm(c && c.includes("edel_v2") ? JSON.parse(c) : data)); render(); } catch {}
load().then(() => { if (!me) openWho(); });
setInterval(() => { if (!document.hidden) load(); }, 120000);
// Live updates: refetch whenever anyone changes something
sb.channel("edel-grocery").on("postgres_changes", { event: "*", schema: "public", table: "edel_grocery_items" }, () => load()).on("postgres_changes", { event: "*", schema: "public", table: "edel_grocery_people" }, () => load()).subscribe();
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
